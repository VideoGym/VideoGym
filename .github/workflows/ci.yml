name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/media/**'
      - 'docs/assets/figures/**'
      - 'docs/assets/logos/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/media/**'
      - 'docs/assets/figures/**'
      - 'docs/assets/logos/**'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install build pyflakes pytest
      - run: python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
      - run: python -m pip install "$RUNNER_TEMP"/wheels/*.whl
      - run: python -m pyflakes cli.py data evaluation inference training tests
      - run: python -m pytest -q
      - run: node --check docs/assets/metrics.js
      - run: node --check docs/assets/app.js
      - run: node --check docs/assets/explorer.js
      - run: node --test tests/website/test_metrics.cjs
      - name: Installed CLI and catalog
        working-directory: /tmp
        run: |
          videogym --help
          videogym benchmark check-catalog
