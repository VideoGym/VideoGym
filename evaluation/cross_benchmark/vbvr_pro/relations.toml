classification_rule = "Vision Prompt Paraphrase (prompt_paraphrase): task-level visual re-expression of a trained rule and answer operation; Extrapolation (extrapolation): transfer of a trained mechanism to changed scale, parameters, structures, predicates, or boundary conditions; Composition (composition): serial chaining or joint combination of independently trained rules through an intermediate state or non-redundant joint constraint; Cross-Task (cross_task): unseen task rule or solving objective. Selection followed by its answer mark, an explicit execution order, or a prompt-supplied intermediate answer is not a second rule. Categories are defined relative to VBVR-Pro's 250 training tasks from task contracts rather than model scores, and do not establish out-of-support parameters for every unpaired benchmark instance."

