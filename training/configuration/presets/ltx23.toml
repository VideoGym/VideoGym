model = "ltx-2.3"
pretrained_model_name_or_path = "Lightricks/LTX-2.3"
manifest = "outputs/training/train.jsonl"
output_dir = "runs/ltx23-full-sft"
stage = "sft"
tuning = "full"
batch_samples = 32
epochs = 10
max_updates = 76880
learning_rate = 1e-5
min_lr_ratio = 0.1
lr_scheduler = "linear"
audio_loss = false
save_every = 7688
sharding = "fsdp"

[video]
width = 768
height = 512
num_frames = 241
fps = 24.0

[flow_grpo]
group_size = 4
rollout_steps = 20
noise_level = 0.7
clip_range = 0.0001
rollout_microbatch_size = 1
trace_device = "cpu"
